# See: https://github.com/DavidAnson/markdownlint

# Unordered list style
MD004:
  style: dash

# Line length is disabled: Prettier already normalises the layout, but it
# cannot wrap Chinese prose because there are no spaces to break on. Keeping
# MD013 enabled would fail on every longer paragraph.
MD013: false

# Ordered list item prefix
MD029:
  style: one

# Spaces after list markers
MD030:
  ul_single: 1
  ol_single: 1
  ul_multi: 1
  ol_multi: 1

# Code block style
MD046:
  style: fenced
