name: Setup vcpkg
description:
  Install vcpkg on Windows, macOS and Linux runners. No ports are installed.
author: RealChuan

branding:
  icon: package
  color: blue

inputs:
  repository:
    description: Git repository to install vcpkg from.
    required: false
    default: https://github.com/microsoft/vcpkg
  ref:
    description: Branch, tag or commit of the repository to install.
    required: false
    default: master
  install-dir:
    description: >-
      Directory to install vcpkg into. Defaults to C:\vcpkg on Windows and
      /usr/local/share/vcpkg on Linux and macOS.
    required: false
    default: ''
  clean:
    description: Remove an existing installation before installing.
    required: false
    default: 'true'
  run-integrate:
    description: Run `vcpkg integrate install` after bootstrapping vcpkg.
    required: false
    default: 'true'

outputs:
  vcpkg-root:
    description: Directory vcpkg was installed into.
  vcpkg-version:
    description: Version of the installed vcpkg.

runs:
  using: node24
  main: dist/index.js
